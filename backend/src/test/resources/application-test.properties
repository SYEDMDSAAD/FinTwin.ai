# ── External services — all disabled in tests ────────────────────────────────
mail.enabled=false
sms.enabled=false

# ── Tracing — disable to avoid Zipkin connection errors ──────────────────────
management.tracing.sampling.probability=0.0

# ── CORS ─────────────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost:5173

# ── Secrets — use dev defaults (no-op warnings printed, not errors) ───────────
admin.key=test-admin-key
ai.service.internal-key=test-internal-key

# ── DataSeeder — disable in tests to avoid collision with test users ──────────
seed.admin.enabled=false

# ── Redis — disabled (in-memory fallback used) ────────────────────────────────
redis.url=

# ── Rate limiting — disabled to avoid limit exhaustion during test suites ─────
rate.limit.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.fintwin=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN

# Bank alert emails switched on so the webhook route is exercised end to end
inbound.email.domain=in.fintwin.test
inbound.email.secret=integration-test-inbound-secret-0123456789
