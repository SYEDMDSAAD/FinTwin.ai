# ── Database ──────────────────────────────────────────────────────────────────
# Production: set DB_URL=jdbc:postgresql://host:5432/fintwin?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintwin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
# Default 10 connections exhausts under load. 20 max is safe for one instance;
# multiply by replica count when provisioning DB. RDS/Cloud SQL default max = 100.
spring.datasource.hikari.pool-name=FintwinPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
# 3 idle connections — enough for auth+me + initial API burst without 5 full SSL handshakes at boot
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# 25s keepalive — pings before Supabase closes idle connections at ~30s; prevents stale-conn delays
spring.datasource.hikari.keepalive-time=25000

# ── Flyway (Schema Migrations) ────────────────────────────────────────────────
# Flyway runs all pending db/migration/V*.sql files on startup.
# By default connects via spring.datasource.*
#
# Supabase connection guidance:
#   App URL  → Session-mode pooler (supports HikariCP prepared statements):
#              jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   Flyway URL → Direct connection preferred for DDL reliability:
#              jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
#   Set FLYWAY_DB_URL in .env to the direct URL; leave DB_URL as the pooler URL.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fintwin}}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:}
spring.flyway.schemas=public
# baseline-on-migrate=true only on first run if the DB already has tables (not created by Flyway).
# Leave false for fresh Supabase projects.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# ── JPA ───────────────────────────────────────────────────────────────────────
# Flyway owns all DDL. Hibernate only validates that the schema matches entities.
# To bypass Flyway during local dev without a DB: set FLYWAY_ENABLED=false DDL_AUTO=update in .env
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Prevents Hibernate from holding DB connections open for the full HTTP request lifecycle
spring.jpa.open-in-view=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Uploads ───────────────────────────────────────────────────────────────────
# Hard cap on multipart payloads (CSV import + receipt screenshots). The services
# enforce tighter per-type limits (5 MB CSV, 10 MB image); this is the outer bound.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:12MB}

# ── Trusted proxies (rate limiting / IP blocking) ─────────────────────────────
# Comma-separated proxy addresses/prefixes whose X-Forwarded-For we trust.
# Empty = trust nothing (use socket peer). Set to your ingress/LB IP(s) in prod,
# e.g. SECURITY_TRUSTED_PROXIES=10.0. for an in-cluster ingress on the 10.0.x.x range.
security.trusted-proxies=${SECURITY_TRUSTED_PROXIES:}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:FinTwinSuperSecretJwtKeyForProduction2026SecureKey}

# ── AI Service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.internal-key=${AI_INTERNAL_KEY:}

# ── Redis (optional) ──────────────────────────────────────────────────────────
# When set, enables distributed rate limiting (required for multi-instance deploys).
# When unset, falls back to in-memory rate limiting (single-instance only).
# Format: redis://host:port  or  redis://:password@host:port
redis.url=${REDIS_URL:}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Field-level Encryption ────────────────────────────────────────────────────
# Generate: openssl rand -base64 32
encryption.key=${FINTWIN_ENCRYPTION_KEY:}

# ── Setu Account Aggregator ───────────────────────────────────────────────────
setu.aa.base-url=${SETU_BASE_URL:https://fiu-uat.setu.co}
setu.aa.client-id=${SETU_CLIENT_ID:}
setu.aa.client-secret=${SETU_CLIENT_SECRET:}
setu.aa.redirect-url=${SETU_REDIRECT_URL:http://localhost:5173/bank-connected}
setu.aa.product-instance-id=${SETU_PRODUCT_INSTANCE_ID:}

# ── Admin ─────────────────────────────────────────────────────────────────────
admin.key=${ADMIN_KEY:}

# ── Mail (optional — ticket replies + password reset) ─────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.from=${MAIL_FROM:FinTwin Support}
mail.enabled=${MAIL_ENABLED:false}

# ── Actuator ──────────────────────────────────────────────────────────────────
# Exposes /actuator/health for container liveness/readiness probes.
# /actuator/info, /metrics and /prometheus for observability.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# JDBC batch inserts — reduces round-trips for saveAll()
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── DB statement timeout — kills runaway queries before they exhaust the pool ─
spring.datasource.hikari.connection-init-sql=SET statement_timeout='30000'

# ── Prometheus metrics ────────────────────────────────────────────────────────
# (exposure.include is declared once in the Actuator section above)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s
management.metrics.tags.application=fintwin-backend

# ── Distributed tracing (Brave/Zipkin) ───────────────────────────────────────
# Sample 10% in prod; override to 1.0 in dev for full traces
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# ── Resilience4j — AI service circuit breaker ─────────────────────────────────
resilience4j.circuitbreaker.instances.ai-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.ai-service.sliding-window-type=COUNT_BASED
# Trip circuit after 5 failures (was 10) — faster detection of AI service being down
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ai-service.automatic-transition-from-open-to-half-open-enabled=true

# AI service retry: max-attempts=1 disables retrying — retrying a slow AI inference call
# just multiplies the wait; the circuit breaker handles repeated failures instead.
resilience4j.retry.instances.ai-service.max-attempts=1

# ── Resilience4j — Setu API retry ─────────────────────────────────────────────
resilience4j.retry.instances.setu-api.max-attempts=3
resilience4j.retry.instances.setu-api.wait-duration=1s
resilience4j.retry.instances.setu-api.retry-exceptions=java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

# ── Caching (Caffeine) ───────────────────────────────────────────────────────
# market-quotes: 60s TTL matches MarketTicker's 60s refresh interval
# user-forecast: 5min TTL — AI forecast takes 10-20s; cache per-user so
#   repeat page loads return instantly without re-calling phi3:mini
spring.cache.type=caffeine
# user-insights: per-user AI-generated insights (evicted on any transaction write)
spring.cache.cache-names=market-quotes,user-forecast,user-score,user-insights
spring.cache.caffeine.spec=expireAfterWrite=5m,maximumSize=500

# ── SMS notifications (MSG91) ─────────────────────────────────────────────────
# SMS_ENABLED=true requires SMS_API_KEY + SMS_OTP_TEMPLATE_ID + SMS_ALERT_TEMPLATE_ID
sms.enabled=${SMS_ENABLED:false}
sms.provider.api-key=${SMS_API_KEY:}
sms.provider.sender-id=${SMS_SENDER_ID:FTWIN}
sms.provider.otp-template-id=${SMS_OTP_TEMPLATE_ID:}
sms.provider.alert-template-id=${SMS_ALERT_TEMPLATE_ID:}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Disable Swagger UI in production; enable in dev via SWAGGER_ENABLED=true env var
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.show-actuator=false
