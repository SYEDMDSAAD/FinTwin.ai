# ── Database ──────────────────────────────────────────────────────────────────
# Production: set DB_URL=jdbc:postgresql://host:5432/fintwin?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintwin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ── HikariCP Connection Pool ──────────────────────────────────────────────────
# Default 10 connections exhausts under load. 20 max is safe for one instance;
# multiply by replica count when provisioning DB. RDS/Cloud SQL default max = 100.
spring.datasource.hikari.pool-name=FintwinPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ── Flyway (Schema Migrations) ────────────────────────────────────────────────
# Flyway runs all pending db/migration/V*.sql files on startup.
# By default connects via spring.datasource.*
#
# Supabase connection guidance:
#   App URL  → Session-mode pooler (supports HikariCP prepared statements):
#              jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   Flyway URL → Direct connection preferred for DDL reliability:
#              jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
#   Set FLYWAY_DB_URL in .env to the direct URL; leave DB_URL as the pooler URL.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fintwin}}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:}
spring.flyway.schemas=public
# baseline-on-migrate=true only on first run if the DB already has tables (not created by Flyway).
# Leave false for fresh Supabase projects.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# ── JPA ───────────────────────────────────────────────────────────────────────
# Flyway owns all DDL. Hibernate only validates that the schema matches entities.
# To bypass Flyway during local dev without a DB: set FLYWAY_ENABLED=false DDL_AUTO=update in .env
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:FinTwinSuperSecretJwtKeyForProduction2026SecureKey}

# ── AI Service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.internal-key=${AI_INTERNAL_KEY:}

# ── Redis (optional) ──────────────────────────────────────────────────────────
# When set, enables distributed rate limiting (required for multi-instance deploys).
# When unset, falls back to in-memory rate limiting (single-instance only).
# Format: redis://host:port  or  redis://:password@host:port
redis.url=${REDIS_URL:}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Field-level Encryption ────────────────────────────────────────────────────
# Generate: openssl rand -base64 32
encryption.key=${FINTWIN_ENCRYPTION_KEY:}

# ── Setu Account Aggregator ───────────────────────────────────────────────────
setu.aa.base-url=${SETU_BASE_URL:https://fiu-uat.setu.co}
setu.aa.client-id=${SETU_CLIENT_ID:}
setu.aa.client-secret=${SETU_CLIENT_SECRET:}
setu.aa.redirect-url=${SETU_REDIRECT_URL:http://localhost:5173/bank-connected}
setu.aa.product-instance-id=${SETU_PRODUCT_INSTANCE_ID:}

# ── Admin ─────────────────────────────────────────────────────────────────────
admin.key=${ADMIN_KEY:}

# ── Mail (optional — ticket replies + password reset) ─────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.from=${MAIL_FROM:FinTwin Support}
mail.enabled=${MAIL_ENABLED:false}

# ── Actuator ──────────────────────────────────────────────────────────────────
# Exposes /actuator/health for container liveness/readiness probes.
# /actuator/info and /actuator/metrics for observability.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# JDBC batch inserts — reduces round-trips for saveAll()
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
