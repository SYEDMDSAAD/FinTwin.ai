apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fintwin
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # --requirepass enables auth. $(REDIS_PASSWORD) is interpolated by
          # kubelet from the env below, so the secret never appears literally
          # in the manifest.
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintwin-secrets
                  key: REDIS_PASSWORD
            # redis-cli reads REDISCLI_AUTH automatically, so the health probes
            # authenticate without putting the password in the probe command line.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: fintwin-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
