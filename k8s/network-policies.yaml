# NetworkPolicies — default-deny ingress inside the fintwin namespace, then
# explicit allows for the real traffic flows. This gives network segmentation:
# a compromised pod can no longer freely reach Postgres, Redis, or the AI service.
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, Weave, or the
# managed equivalents on EKS/GKE/AKS). The default kubenet/flannel setups do NOT
# enforce these — verify with your provider before relying on them.
#
# Scope: Ingress only. Egress is intentionally left open so DNS and outbound
# calls (Setu, Yahoo Finance, SMTP, Let's Encrypt) keep working without a large
# egress-allow matrix. Tighten egress later if the threat model needs it.
#
# NOTE on health probes: kubelet liveness/readiness probes originate from the
# node, not a pod. Most enforcing CNIs allow node→pod traffic by default, so the
# probes keep working; if your CNI is stricter, add an allow for the node CIDR.

# ── Baseline: deny all ingress to every pod in the namespace ──────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fintwin
spec:
  podSelector: {}          # every pod
  policyTypes:
    - Ingress
  # No ingress rules → nothing is allowed in unless another policy permits it.
---
# ── Postgres: only the backend may connect ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-backend
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
---
# ── Redis: only the backend may connect ───────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-backend
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
---
# ── AI service: only the backend may call it ─────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-service-from-backend
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: ai-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8000
---
# ── Backend: reachable from the ingress controller and from Prometheus ────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # nginx ingress controller (public traffic terminates here). The
        # kubernetes.io/metadata.name label is auto-applied to every namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # Prometheus scrapes /actuator/prometheus in-cluster.
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# ── Frontend: reachable only from the ingress controller ──────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
---
# ── Prometheus: reachable from Grafana (dashboards) ───────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-from-grafana
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
---
# ── Alertmanager: reachable from Prometheus (alert delivery) ──────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alertmanager-from-prometheus
  namespace: fintwin
spec:
  podSelector:
    matchLabels:
      app: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9093
