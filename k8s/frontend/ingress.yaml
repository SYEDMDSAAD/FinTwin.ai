# Ingress — routes public traffic to frontend and backend.
#
# Prerequisites:
#   1. Install nginx ingress controller:
#      kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
#   2. Install cert-manager for automatic TLS (Let's Encrypt):
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#      kubectl apply -f k8s/cert-manager-issuer.yaml
#
#   3. Replace app.fintwin.ai with your actual domain.
#
# How traffic flows:
#   Internet → LoadBalancer (cloud) → nginx ingress controller → this Ingress
#   /api/*   → backend-service:8080   (Spring Boot)
#   /*       → frontend-service:80    (React/Nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintwin-ingress
  namespace: fintwin
  annotations:
    kubernetes.io/ingress.class:                "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect:   "true"
    # Preserve real client IP behind the ingress
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Increase timeout for Setu webhooks and AI responses
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # TLS certificate auto-provisioned by cert-manager
    cert-manager.io/cluster-issuer:            "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.fintwin.ai        # ← replace with your domain
      secretName: fintwin-tls
  rules:
    - host: app.fintwin.ai      # ← replace with your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
