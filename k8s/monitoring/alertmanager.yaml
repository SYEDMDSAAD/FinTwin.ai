# Alertmanager — receives alerts from Prometheus (see alert.rules.yml in
# prometheus-configmap.yaml) and routes them to email. The SMTP password is
# mounted from the alertmanager-secret Secret (see alertmanager-secret.yaml.template),
# never inlined in this ConfigMap.
#
# Change the smtp_* / to: addresses below to your real mail relay and on-call
# inbox before applying. A commented Slack receiver is included as an example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: fintwin
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # Same Gmail relay/account the app uses for mail (MAIL_USERNAME). The app
      # password lives in the alertmanager-secret Secret, not here.
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'FinTwin Alerts <mdsaadsyed29@gmail.com>'
      smtp_auth_username: 'mdsaadsyed29@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/smtp-password'
      smtp_require_tls: true

    route:
      receiver: 'email-oncall'
      group_by: ['alertname', 'severity']
      group_wait: 30s          # wait before firing the first notification for a group
      group_interval: 5m       # wait before adding new alerts to an existing group
      repeat_interval: 4h      # re-send an unresolved alert at most this often
      routes:
        # Criticals notify faster and repeat more aggressively.
        - matchers:
            - 'severity="critical"'
          receiver: 'email-oncall'
          group_wait: 10s
          repeat_interval: 1h

    receivers:
      - name: 'email-oncall'
        email_configs:
          - to: 'mdsaadsyed29@gmail.com'   # on-call / admin inbox
            send_resolved: true
        # ── Slack (optional) — uncomment and set the webhook to also post to Slack.
        # slack_configs:
        #   - api_url_file: '/etc/alertmanager/secrets/slack-webhook'
        #     channel: '#alerts'
        #     send_resolved: true

    # Silence a resolved/duplicate flood: don't page on a warning if a critical
    # for the same alertname is already firing.
    inhibit_rules:
      - source_matchers: [ 'severity="critical"' ]
        target_matchers: [ 'severity="warning"' ]
        equal: ['alertname']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: fintwin
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: secrets
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-secret
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: fintwin
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
