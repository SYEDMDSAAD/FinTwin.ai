apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fintwin
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      # ── FinTwin backend (/actuator/prometheus) ───────────────────────────────
      # NOTE: regex matches the pod label set by k8s/backend/deployment.yaml
      # (app: backend). It previously read "fintwin-backend" and matched nothing.
      - job_name: fintwin-backend
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── Identity service ─────────────────────────────────────────────────────
      # (No k8s deployment ships in this repo yet; the job is harmless until one
      # is added with label app: identity-service.)
      - job_name: fintwin-identity
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: identity-service

      # ── AI service (Python/FastAPI) ──────────────────────────────────────────
      - job_name: fintwin-ai
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ai-service

      # ── Prometheus self-scrape ───────────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

  # Starter alert rules. Ops/infra signals only — application security signals
  # (brute force, data exfiltration, config drift) are alerted separately by the
  # backend's SecurityAlertService, which has the audit-log context Prometheus
  # lacks. Wire an Alertmanager to route these to email/Slack/PagerDuty.
  alert.rules.yml: |
    groups:
      - name: fintwin-availability
        rules:
          - alert: BackendDown
            expr: up{job="fintwin-backend"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Backend pod {{ $labels.pod }} is down"
              description: "No successful scrape of the backend for 2 minutes."

          - alert: AIServiceDown
            expr: up{job="fintwin-ai"} == 0
            for: 3m
            labels: { severity: warning }
            annotations:
              summary: "AI service is down"
              description: "AI service unreachable for 3 minutes; AI features will degrade."

      - name: fintwin-errors-latency
        rules:
          # >5% of backend requests returning 5xx over 5 minutes.
          - alert: HighServerErrorRate
            expr: |
              sum(rate(http_server_requests_seconds_count{job="fintwin-backend",status=~"5.."}[5m]))
                / sum(rate(http_server_requests_seconds_count{job="fintwin-backend"}[5m])) > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Backend 5xx error rate above 5%"
              description: "Sustained server errors — possible outage, bad deploy, or attack."

          # p95 latency above 1s for 10 minutes.
          - alert: HighRequestLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_server_requests_seconds_bucket{job="fintwin-backend"}[5m])) by (le)) > 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Backend p95 latency above 1s"
              description: "95th-percentile request latency degraded for 10 minutes."

          # A spike in 401/403 can indicate credential stuffing / token abuse at
          # the HTTP layer — a coarse infra-side companion to the security job.
          - alert: AuthFailureSpike
            expr: |
              sum(rate(http_server_requests_seconds_count{job="fintwin-backend",status=~"40[13]"}[5m])) > 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Elevated 401/403 responses on the backend"
              description: "Sustained auth failures (>5/s) — check the admin security dashboard for brute-force/targeted-account detail."

      - name: fintwin-resources
        rules:
          - alert: HighJVMHeap
            expr: |
              sum by (pod) (jvm_memory_used_bytes{job="fintwin-backend",area="heap"})
                / sum by (pod) (jvm_memory_max_bytes{job="fintwin-backend",area="heap"}) > 0.9
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Backend JVM heap above 90%"
              description: "Pod {{ $labels.pod }} heap sustained above 90% — risk of OOM/GC thrash."

          - alert: HikariPoolNearExhaustion
            expr: |
              hikaricp_connections_active{job="fintwin-backend"}
                / hikaricp_connections_max{job="fintwin-backend"} > 0.9
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "DB connection pool near exhaustion"
              description: "Active HikariCP connections above 90% of max — requests may start queuing."
