apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fintwin
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── FinTwin backend (/actuator/prometheus) ───────────────────────────────
      - job_name: fintwin-backend
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: fintwin-backend
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # ── Identity service ─────────────────────────────────────────────────────
      - job_name: fintwin-identity
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: fintwin-identity

      # ── AI service (Python/FastAPI) ──────────────────────────────────────────
      - job_name: fintwin-ai
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fintwin]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: fintwin-ai-service

      # ── Prometheus self-scrape ───────────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
