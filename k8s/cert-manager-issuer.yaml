# ClusterIssuer — cert-manager uses this to get TLS certificates from Let's Encrypt.
#
# Apply AFTER cert-manager is installed and BEFORE the Ingress:
#   kubectl apply -f k8s/cert-manager-issuer.yaml
#
# Replace the email with your own — Let's Encrypt sends expiry warnings here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@fintwin.ai         # ← replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
