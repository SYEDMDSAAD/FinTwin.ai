apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: fintwin
spec:
  accessModes:
    - ReadWriteOnce
  # Use your cloud provider's storage class:
  #   AWS EKS:   gp2  or  gp3
  #   GKE:       standard  or  premium-rwo
  #   AKS:       managed-premium
  # Leave blank to use the cluster default.
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
