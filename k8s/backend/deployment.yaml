# Replace YOUR_REGISTRY with your container registry prefix.
# Example: ghcr.io/your-org  or  docker.io/youruser
# The TAG is injected by CI/CD (git SHA or semantic version).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fintwin
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never have zero running pods during a deploy
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Spread pods across nodes for HA — tolerate one node going down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: YOUR_REGISTRY/fintwin-backend:TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fintwin-config
            - secretRef:
                name: fintwin-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            # JVM flag MaxRAMPercentage=75 → ~576Mi heap inside this 768Mi container
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give in-flight requests time to complete before the pod is removed
              exec:
                command: ["sh", "-c", "sleep 5"]
