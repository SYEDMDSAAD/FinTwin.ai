apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: fintwin
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: YOUR_REGISTRY/fintwin-ai-service:TAG
          ports:
            - containerPort: 8000
          env:
            - name: AI_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: fintwin-secrets
                  key: AI_INTERNAL_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: fintwin-config
                  key: REDIS_URL
            - name: UVICORN_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: fintwin-config
                  key: UVICORN_WORKERS
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            # Python + ML libs are memory-heavy; Ollama calls are also CPU-bound
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
