# ── Schema ───────────────────────────────────────────────────────────────────
# In production the `users` table is owned by the main backend and the identity
# Flyway migration only ALTERs it. In isolation there is no backend, so disable
# Flyway and let Hibernate build the schema from the identity entities.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ── External services — disabled in tests ───────────────────────────────────
mail.enabled=false
redis.url=

# ── Rate limiting — disabled so suites don't exhaust the per-IP limit ────────
rate.limit.enabled=false

# ── Secrets / config (dev values; jwt.secret falls back to its dev default) ──
internal.key=test-internal-key
admin.key=test-admin-key
google.client.id=
cors.allowed-origins=http://localhost:5173
app.base-url=http://localhost:5173

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.fintwin=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
