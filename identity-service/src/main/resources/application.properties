# ── Identity Service ──────────────────────────────────────────────────────────
server.port=${IDENTITY_PORT:8090}
spring.application.name=identity-service

# ── Database ──────────────────────────────────────────────────────────────────
# Uses the same PostgreSQL database as the main backend.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fintwin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.hikari.pool-name=IdentityPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Flyway ────────────────────────────────────────────────────────────────────
# Uses a separate history table so it doesn't conflict with the main backend's
# flyway_schema_history. The identity service only manages its own new tables.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.url=${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/fintwin}}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:}
spring.flyway.schemas=public
spring.flyway.table=identity_flyway_history
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:true}
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ───────────────────────────────────────────────────────────────────────
# Must match the main backend's JWT_SECRET — both services validate the same tokens.
jwt.secret=${JWT_SECRET:FinTwinSuperSecretJwtKeyForProduction2026SecureKey}

# ── Field Encryption ──────────────────────────────────────────────────────────
# Must match the main backend's FINTWIN_ENCRYPTION_KEY — same encrypted data.
encryption.key=${FINTWIN_ENCRYPTION_KEY:}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Redis (optional — distributed rate limiting) ─────────────────────────────
redis.url=${REDIS_URL:}

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.from=${MAIL_FROM:FinTwin Support}
mail.enabled=${MAIL_ENABLED:false}

# ── App ───────────────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:5173}

# ── Admin Bootstrap ───────────────────────────────────────────────────────────
admin.key=${ADMIN_KEY:}

# ── Internal Service Key ──────────────────────────────────────────────────────
# Used by /api/token/introspect — set to a shared secret known by the main backend.
internal.key=${INTERNAL_KEY:}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
