name: CD — Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn package -q -DskipTests

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── AI Service ───────────────────────────────────────────────────────────

      - name: Build & push — ai-service
        uses: docker/build-push-action@v5
        with:
          context: ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    # Requires KUBECONFIG secret — add it in GitHub repo Settings → Secrets
    if: ${{ secrets.KUBECONFIG != '' }}
    environment: production

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
          FULL_SHA: ${{ github.sha }}
        run: |
          REGISTRY="${{ env.REGISTRY }}/${{ env.OWNER }}"

          kubectl set image deployment/backend \
            backend=${REGISTRY}/fintwin-backend:${FULL_SHA} \
            -n fintwin

          kubectl set image deployment/frontend \
            frontend=${REGISTRY}/fintwin-frontend:${FULL_SHA} \
            -n fintwin

          kubectl set image deployment/ai-service \
            ai-service=${REGISTRY}/fintwin-ai-service:${FULL_SHA} \
            -n fintwin

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend   -n fintwin --timeout=300s
          kubectl rollout status deployment/frontend  -n fintwin --timeout=300s
          kubectl rollout status deployment/ai-service -n fintwin --timeout=300s

      - name: Verify pods
        run: kubectl get pods -n fintwin
