name: CD — Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Backend ──────────────────────────────────────────────────────────────

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn package -q

      - name: Build & push — backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ─────────────────────────────────────────────────────────────

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build & push — frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Identity Service ─────────────────────────────────────────────────────

      - name: Package identity-service
        working-directory: identity-service
        run: mvn package -q

      - name: Build & push — identity-service
        uses: docker/build-push-action@v7
        with:
          context: identity-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-identity-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-identity-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── AI Service ───────────────────────────────────────────────────────────

      - name: Build & push — ai-service
        uses: docker/build-push-action@v7
        with:
          context: ai-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── App Service variants ─────────────────────────────────────────────────
      # The VM runs ai-service and Ollama as two containers; App Service allows
      # one per web app, so it gets a combined image. The front door likewise
      # carries its nginx config in the image instead of mounting it.

      - name: Build & push — ai-service with Ollama (App Service)
        uses: docker/build-push-action@v7
        with:
          context: ai-service
          file: ai-service/Dockerfile.appservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-ollama:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-ai-ollama:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — front door (App Service)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile.appservice
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend-as:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/fintwin-frontend-as:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_TARGET != 'appservice'
    environment: production

    steps:
      - name: Skip if the VM isn't configured
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "DEPLOY_HOST / DEPLOY_SSH_KEY not set — skipping deploy"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # The VM holds a checkout of this repo at ~/fintwin (compose file, nginx
      # config) and a .env.prod it never receives from CI — secrets stay on the
      # box. CI only says which image tag to run.
      - name: Deploy over SSH
        if: steps.check.outputs.skip == 'false'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ github.sha }}
          OWNER: ${{ env.OWNER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "${USER:-fintwin}@$HOST" bash -s <<REMOTE
            set -euo pipefail
            cd ~/fintwin
            git fetch --quiet origin main && git checkout --quiet -f origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # TAG picks the images built from this commit; .env.prod holds the secrets
            export REGISTRY="ghcr.io/$OWNER" TAG="$TAG"
            sed -i "s|^TAG=.*|TAG=$TAG|" .env.prod || echo "TAG=$TAG" >> .env.prod

            docker compose -f docker-compose.azure.yml --env-file .env.prod pull
            docker compose -f docker-compose.azure.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f --filter "until=168h"
          REMOTE

      - name: Wait for the app to answer
        if: steps.check.outputs.skip == 'false'
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          [ -n "$BASE_URL" ] || { echo "PROD_BASE_URL variable not set — skipping health check"; exit 0; }
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/actuator/health" || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "The app did not report healthy within 5 minutes"
          exit 1

  # ── App Service ─────────────────────────────────────────────────────────────
  # Runs instead of the VM job when the DEPLOY_TARGET variable is "appservice".
  # Set up once with scripts/azure-app-service-setup.sh.
  deploy-appservice:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_TARGET == 'appservice'
    environment: production

    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'fintwin' }}
      PREFIX: ${{ vars.AZURE_APP_PREFIX || 'fintwin' }}

    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point each web app at this commit's image
        env:
          TAG: ${{ github.sha }}
          OWNER: ${{ env.OWNER }}
        run: |
          set -euo pipefail
          IMAGES="api:fintwin-backend auth:fintwin-identity-service ai:fintwin-ai-ollama web:fintwin-frontend-as"
          for pair in $IMAGES; do
            app="${PREFIX}-${pair%%:*}"
            image="ghcr.io/${OWNER}/${pair##*:}:${TAG}"
            echo "→ $app ← $image"
            az webapp config container set \
              --name "$app" --resource-group "$RG" \
              --container-image-name "$image" --output none
          done

          # Restarting in this order means the front door comes back last,
          # once what it proxies to is already up
          for suffix in ai auth api web; do
            az webapp restart --name "${PREFIX}-${suffix}" --resource-group "$RG" --output none
          done

      - name: Wait for the app to answer
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          URL="${BASE_URL:-https://${PREFIX}-web.azurewebsites.net}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/actuator/health" || true)
            if [ "$code" = "200" ]; then echo "healthy after $((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "No healthy response from $URL within 5 minutes"
          exit 1
