name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 0'   # every Sunday at 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, identity-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compute cache week
        id: date
        run: echo "week=$(date +%Y-W%U)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          # Keyed by week (not run_id, which is unique every run and could never
          # be reused) so the NVD DB persists across runs — a cold sync without
          # an API key is rate-limited to 5 req/30s and reliably hits 429.
          key: owasp-nvd-${{ steps.date.outputs.week }}
          restore-keys: owasp-nvd-

      - name: Run OWASP dependency check
        working-directory: ${{ matrix.service }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML,SARIF \
            -q

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.service }}/target/dependency-check-report.sarif
          category: owasp-${{ matrix.service }}
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.html
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ai-service, identity-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defensive: building an image here plus Trivy's ~1GB combined vuln+Java
      # DB download leaves little headroom on the runner's default disk.
      # Reclaim preinstalled toolchains we don't use before the build/scan.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Build image for scanning
        run: docker build -t fintwin-${{ matrix.service }}:scan ./${{ matrix.service }}

      # trivy-action@v0.36.0 defaults to Trivy CLI v0.70.0, which crashes
      # right after "Detecting vulnerabilities" (no error text, exit 1) when
      # format: sarif is combined with exit-code — reproduced this ourselves
      # even against a genuinely clean image. v0.72.0 doesn't have the bug;
      # pin the underlying CLI explicitly rather than relying on the action's
      # default, which floats to whatever aquasecurity ships next.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.72.0
          image-ref: fintwin-${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
        continue-on-error: true

  secret-scan:
    name: Detect Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified
