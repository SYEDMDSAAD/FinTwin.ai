name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 0'   # every Sunday at 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, identity-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compute cache week
        id: date
        run: echo "week=$(date +%Y-W%U)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          # Keyed by week (not run_id, which is unique every run and could never
          # be reused) so the NVD DB persists across runs — a cold sync without
          # an API key is rate-limited to 5 req/30s and reliably hits 429.
          key: owasp-nvd-${{ steps.date.outputs.week }}
          restore-keys: owasp-nvd-

      - name: Run OWASP dependency check
        working-directory: ${{ matrix.service }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML,SARIF \
            -Dnvd.api.key="$NVD_API_KEY" \
            -DsuppressionFiles=${{ github.workspace }}/.github/dependency-check-suppressions.xml \
            -q

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ matrix.service }}/target/dependency-check-report.sarif
          category: owasp-${{ matrix.service }}
        continue-on-error: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/dependency-check-report.html
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ai-service, identity-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Defensive: building an image here plus Trivy's ~1GB combined vuln+Java
      # DB download leaves little headroom on the runner's default disk.
      # Reclaim preinstalled toolchains we don't use before the build/scan.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - name: Build image for scanning
        run: docker build -t fintwin-${{ matrix.service }}:scan ./${{ matrix.service }}

      # trivy-action's composite wrapper crashes right after "Detecting
      # vulnerabilities" with a bare exit code 1 and no error text — happens
      # even on a genuinely clean image, and persists across both v0.70.0 and
      # v0.72.0 of the underlying CLI, so it's the wrapper itself, not the
      # scan. The identical `trivy image` invocation run directly (same flags,
      # same image, same DB) completes fine outside the wrapper. Install the
      # CLI and invoke it directly so a real failure is actually visible.
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.72.0

      - name: Scan with Trivy
        run: |
          trivy image \
            --format sarif \
            --output trivy-${{ matrix.service }}.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignorefile ${{ matrix.service }}/.trivyignore \
            fintwin-${{ matrix.service }}:scan

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
        continue-on-error: true

  secret-scan:
    name: Detect Leaked Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified
