worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Hide nginx version from Server header and error pages
    server_tokens off;

    # Statement PDFs and receipt photos routinely exceed nginx's 1 MB default.
    # Matches the backend's multipart cap (10 MB file, 12 MB request).
    client_max_body_size 12m;

    # ── TLS session cache shared across workers ───────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Protocol + ciphers ────────────────────────────────────────────────
    # TLS 1.2 kept for broad client compatibility; 1.3 preferred
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ── OCSP stapling ─────────────────────────────────────────────────────
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── DH parameters for DHE cipher strength ────────────────────────────
    # Generate with: openssl dhparam -out /etc/nginx/certs/dhparam.pem 2048
    # Uncomment after generating:
    # ssl_dhparam /etc/nginx/certs/dhparam.pem;

    # ── Security headers applied to all virtual hosts ─────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
    # X-XSS-Protection: modern recommendation is to set to 0 (disable legacy XSS auditor)
    add_header X-XSS-Protection          "0"                                            always;

    # ── Redirect all HTTP → HTTPS (except ACME challenge) ────────────────
    server {
        listen      80;
        server_name _;

        # Let's Encrypt ACME webroot challenge — must be served over HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Frontend + API proxy ──────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        server_name fintwin.local;   # replace with real domain: FINTWIN_DOMAIN env var

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        root  /usr/share/nginx/html;
        index index.html;

        # React SPA — all non-asset paths fall back to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Identity service — auth, 2FA, tokens, admin user management
        location ~ ^/api/(auth|2fa|token|admin)(/|$) {
            proxy_pass         http://identity-service:8090;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }

        # Bootstrap admin endpoint (X-Admin-Key protected, no JWT)
        location /admin/ {
            proxy_pass         http://identity-service:8090;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }

        # All other /api/* routes go to the main backend
        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;

            # Webhook timeout — Setu can take up to 30s
            proxy_read_timeout 60s;
        }

        # Block direct access to the AI service from the internet
        location /ai/ {
            return 403;
        }
    }
}
