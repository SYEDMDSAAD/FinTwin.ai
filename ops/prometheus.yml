global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── FinTwin backend ──────────────────────────────────────────────────────────
  - job_name: fintwin-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
        labels:
          application: fintwin-backend

  # ── Identity service ─────────────────────────────────────────────────────────
  - job_name: fintwin-identity
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [identity-service:8090]
        labels:
          application: fintwin-identity

  # ── Prometheus self-scrape ───────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
