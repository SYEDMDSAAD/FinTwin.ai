global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ── FinTwin backend ──────────────────────────────────────────────────────────
  - job_name: fintwin-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
        labels:
          application: fintwin-backend

  # ── Identity service ─────────────────────────────────────────────────────────
  - job_name: fintwin-identity
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [identity-service:8090]
        labels:
          application: fintwin-identity

  # ── AI service ───────────────────────────────────────────────────────────────
  # Guardrail counters: generations by outcome, tips dropped by the grounding
  # layer, LLM latency against the backend's 20s deadline.
  - job_name: fintwin-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: [ai-service:8000]
        labels:
          application: fintwin-ai-service

  # ── Prometheus self-scrape ───────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
