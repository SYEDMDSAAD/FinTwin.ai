# FinTwin.ai on a single Azure VM — everything the app needs, in one file.
#
#   docker compose -f docker-compose.azure.yml --env-file .env.prod up -d
#
# Self-contained on purpose: it does not extend docker-compose.yml, so what
# runs in production is exactly what is written here. Postgres is Supabase, not
# a container — the database is the one thing worth paying someone else to keep
# backed up. See docs/azure-vm-deployment.md for the full runbook.
#
# Required in .env.prod:
#   REGISTRY  ghcr.io/<your github user, lowercase>
#   TAG       the image tag to run (a commit SHA, or "latest")
#   DB_URL / DB_USERNAME / DB_PASSWORD        Supabase connection
#   JWT_SECRET / FINTWIN_ENCRYPTION_KEY       32+ chars; losing the encryption
#                                             key makes stored data unreadable
#   AI_INTERNAL_KEY / INTERNAL_KEY / ADMIN_KEY
#   APP_BASE_URL / CORS_ALLOWED_ORIGINS       https://your-domain
#   MAIL_* for sign-up OTP emails, SETU_* if the bank sandbox is used

services:

  # ── Redis — caches and rate limiting ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [fintwin]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 256M }
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ── Ollama — the model behind the copilot, coach and reports ────────────────
  # The largest thing on the box: ~2 GB of model held in memory between
  # requests so answers don't wait for a reload.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks: [fintwin]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
        reservations: { memory: 1G }
    logging: *logging

  # Downloads the model once, then exits. Ollama fetches a model only when told
  # to, so without this the first copilot question fails on a fresh VM.
  ollama-pull:
    image: ollama/ollama:latest
    networks: [fintwin]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"
    logging: *logging

  # ── AI service — statements, forecasts, copilot, market data ────────────────
  ai-service:
    image: ${REGISTRY:?REGISTRY is required}/fintwin-ai-service:${TAG:?TAG is required}
    restart: unless-stopped
    networks: [fintwin]
    depends_on:
      redis: { condition: service_healthy }
      ollama: { condition: service_started }
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY is required}
      REDIS_URL:       redis://redis:6379
      BACKEND_URL:     http://backend:8080
      OLLAMA_URL:      http://ollama:11434/api/generate
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }
    logging: *logging

  # ── Spring Boot backend ─────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY:?REGISTRY is required}/fintwin-backend:${TAG:?TAG is required}
    restart: unless-stopped
    networks: [fintwin]
    depends_on:
      redis: { condition: service_healthy }
      ai-service: { condition: service_started }
    environment:
      # Supabase — use the pooler host on IPv4-only networks, and sslmode=require
      DB_URL:                    ${DB_URL:?DB_URL is required}
      DB_USERNAME:               ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD:               ${DB_PASSWORD:?DB_PASSWORD is required}
      DDL_AUTO:                  validate        # Flyway owns the schema
      SHOW_SQL:                  "false"
      APP_REQUIRE_SECURE_CONFIG: "true"          # refuse to start on dev defaults
      DB_POOL_MAX:               ${DB_POOL_MAX:-20}
      JWT_SECRET:                ${JWT_SECRET:?JWT_SECRET is required}
      FINTWIN_ENCRYPTION_KEY:    ${FINTWIN_ENCRYPTION_KEY:?FINTWIN_ENCRYPTION_KEY is required}
      AI_SERVICE_URL:            http://ai-service:8000
      AI_INTERNAL_KEY:           ${AI_INTERNAL_KEY:?AI_INTERNAL_KEY is required}
      REDIS_URL:                 redis://redis:6379
      CORS_ALLOWED_ORIGINS:      ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      GOOGLE_CLIENT_ID:          ${GOOGLE_CLIENT_ID:-}
      SETU_BASE_URL:             ${SETU_BASE_URL:-https://fiu-uat.setu.co}
      SETU_CLIENT_ID:            ${SETU_CLIENT_ID:-}
      SETU_CLIENT_SECRET:        ${SETU_CLIENT_SECRET:-}
      SETU_REDIRECT_URL:         ${SETU_REDIRECT_URL:-}
      SETU_PRODUCT_INSTANCE_ID:  ${SETU_PRODUCT_INSTANCE_ID:-}
      SETU_WEBHOOK_SECRET:       ${SETU_WEBHOOK_SECRET:-}
      INBOUND_EMAIL_DOMAIN:      ${INBOUND_EMAIL_DOMAIN:-}
      INBOUND_EMAIL_SECRET:      ${INBOUND_EMAIL_SECRET:-}
    deploy:
      resources:
        # -XX:MaxRAMPercentage=75 → ~768 MB heap inside a 1 GB container
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  # ── Identity service — sign-up, login, 2FA, tokens ──────────────────────────
  identity-service:
    image: ${REGISTRY:?REGISTRY is required}/fintwin-identity-service:${TAG:?TAG is required}
    restart: unless-stopped
    networks: [fintwin]
    depends_on:
      redis: { condition: service_healthy }
    environment:
      DB_URL:                 ${DB_URL:?DB_URL is required}
      DB_USERNAME:            ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD:            ${DB_PASSWORD:?DB_PASSWORD is required}
      # The backend and this service verify each other's tokens with this key
      JWT_SECRET:             ${JWT_SECRET:?JWT_SECRET is required}
      FINTWIN_ENCRYPTION_KEY: ${FINTWIN_ENCRYPTION_KEY:?FINTWIN_ENCRYPTION_KEY is required}
      REDIS_URL:              redis://redis:6379
      CORS_ALLOWED_ORIGINS:   ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      APP_BASE_URL:           ${APP_BASE_URL:?APP_BASE_URL is required}
      GOOGLE_CLIENT_ID:       ${GOOGLE_CLIENT_ID:-}
      ADMIN_KEY:              ${ADMIN_KEY:-}
      INTERNAL_KEY:           ${INTERNAL_KEY:-}
      MAIL_HOST:              ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:              ${MAIL_PORT:-587}
      MAIL_USERNAME:          ${MAIL_USERNAME:-}
      MAIL_PASSWORD:          ${MAIL_PASSWORD:-}
      MAIL_ENABLED:           ${MAIL_ENABLED:-true}
    deploy:
      resources:
        limits: { cpus: "0.7", memory: 768M }
    logging: *logging

  # ── Nginx — TLS, the React app, and routing to the services ─────────────────
  # The image is the built frontend (static files baked in); the config comes
  # from the repo so routing changes ship with a git pull, not a rebuild.
  nginx:
    image: ${REGISTRY:?REGISTRY is required}/fintwin-frontend:${TAG:?TAG is required}
    restart: unless-stopped
    networks: [fintwin]
    depends_on: [backend, identity-service]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  # ── Certbot — renews the TLS certificate ────────────────────────────────────
  # Issue the first certificate by hand (see the runbook); this keeps it alive.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt:rw
      - certbot-webroot:/var/www/certbot:rw
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet 2>/dev/null || true;
               sleep 12h & wait $${!};
             done"
    logging: *logging

networks:
  fintwin:
    driver: bridge

volumes:
  ollama:          # ~2 GB of model — survives redeploys
  redisdata:
  letsencrypt:
  certbot-webroot:
